name: Synthetic-data tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run source-independent tests
        run: python -m pytest -q tests/test_torquelab.py
      # The full Streamlit AppTest in tests/test_app.py requires external
      # third-party vehicle data and generated model artifacts; it runs
      # locally only after following the README reproduction instructions.
